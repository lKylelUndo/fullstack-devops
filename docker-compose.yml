services:

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: fullstack-devops-client
    ports:
      - "3000:3000"
    restart: always

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: fullstack-devops-server
    ports:
      - "8000:8000"
    restart: always

    # The reason why no ports beacuse of nginx

  nginx:
    image: nginx:alpine
    container_name: fullstack-devops-nginx
    ports:
      - "3000:3000"
      - "8000:8000"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - client
      - server
    restart: always