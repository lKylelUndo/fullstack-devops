services:

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: fullstack-devops-client
    restart: always

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: fullstack-devops-server
    restart: always

    # The reason why no ports beacuse of nginx

  nginx:
    image: nginx:alpine
    container_name: fullstack-devops-nginx
    ports:
      - "3000:3000" # [Host Machine Port - CLIENT] : [Inside Nginx Container Port]
      - "8000:8000" # [Host Machine Port - SERVER] : [Inside Nginx Container Port]
      # This tells Nginx to recieve traffic on port 8000 and 3000 inside Nginx container
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - client
      - server
    restart: always