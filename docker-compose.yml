services:

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: alumnai-client
    ports:
      - "3000:3000"
    depends_on:
      - server


  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: alumnai-server
    ports:
      - "8000:8000"