# ==============================================================================
# NGINX REVERSE PROXY CONFIGURATION
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. FRONTEND CLIENT PROXY (Port 3000)
# ------------------------------------------------------------------------------
server {
    # Port Nginx listens on from your host browser (http://localhost:3000)
    listen 3000;
    server_name localhost;

    location / {
        # 'client' = Docker service name defined in docker-compose.yml
        # ':3000'  = Port Next.js application is listening on inside the container
        proxy_pass http://client:3000;

        # HTTP/1.1 is required for WebSockets & persistent keep-alive connections
        proxy_http_version 1.1;

        # Headers required for Next.js Fast Refresh / Hot Reload WebSockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Pass the original Host header (localhost:3000) to the container
        proxy_set_header Host $host;
    }
}

# ------------------------------------------------------------------------------
# 2. BACKEND API & SOCKET.IO SERVER PROXY (Port 8000)
# ------------------------------------------------------------------------------
server {
    # Port Nginx listens on from your host browser (http://localhost:8000)
    listen 8000;
    server_name localhost;

    location / {
        # 'server' = Docker service name defined in docker-compose.yml
        # ':8000'  = Port Express server is listening on inside the container (app.listen(8000))
        proxy_pass http://server:8000;

        # HTTP/1.1 is required for WebSocket protocol upgrade
        proxy_http_version 1.1;

        # Mandatory WebSocket upgrade headers for Socket.io
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Pass original Host header to Express backend
        proxy_set_header Host $host;

        # Prevent Nginx from closing quiet/idle WebSocket connections (defaults to 60s)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}